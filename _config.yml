#
# Site configuration
#

# Displayed in the header and <title>
name: Ao Jiang

# Shown in meta descriptions / social previews
description: AI engineer @ Alibaba Cloud — NLP, LLMs, and language engineering.

# Profile links
github_username: Lazarus-coder
email: jao0616@uw.edu

# Site URL (no trailing slash). Used for sitemap, feed and canonical links.
url: https://lazarus-coder.github.io
baseurl: ""

#
# Build settings
#

permalink: /:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :expanded

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - .jekyll-cache
  - vendor