---
layout: default
---

<article class="post container">
  <p class="post-top mono">
    <a href="{{ '/' | relative_url }}">← /posts</a>
    <span class="post-http" aria-hidden="true">200 OK</span>
  </p>

  <h1 class="post-title">{{ page.title }}</h1>

  <p class="post-meta mono">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    {%- for tag in page.tags %} <span class="tag">#{{ tag }}</span>{% endfor -%}
  </p>

  <div class="entry">
    {{ content }}
  </div>

  <nav class="post-nav mono" aria-label="More posts">
    {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>
    {% else %}<span></span>{% endif %}
    {% if page.next %}
      <a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>
    {% endif %}
  </nav>
</article>
