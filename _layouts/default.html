<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.url == '/' %}{{ site.name }} — AI engineer · NLP / LLM{% elsif page.title %}{{ page.title }} — {{ site.name }}{% else %}{{ site.name }}{% endif %}</title>

    <meta charset="utf-8">
    {% include meta.html %}

    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.name }} — writing" href="{{ '/feed.xml' | relative_url }}">

    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- the sea is drawn by ~230 lines of vanilla js. read the source. -->
    <header class="masthead">
      <div class="container masthead-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}"><span class="mark">λ</span> Ao Jiang</a>
        <nav class="nav">
          <a href="{{ '/' | relative_url }}">/posts</a>
          <a href="{{ '/about/' | relative_url }}">/about</a>
          <a href="{{ '/feed.xml' | relative_url }}">/feed.xml</a>
          <a href="https://github.com/{{ site.github_username }}" rel="me">github ↗</a>
          <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle theme (t)" aria-label="Toggle theme">◐</button>
        </nav>
      </div>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer class="footer">
      <div class="container">
        <p>© {{ site.time | date: '%Y' }} {{ site.name }} · no trackers, no cookies · built with Jekyll on GitHub Pages</p>
      </div>
    </footer>

    <script src="{{ '/assets/js/dandelion.js' | relative_url }}" defer></script>
    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function current() {
          var t = document.documentElement.dataset.theme;
          return (t === 'light' || t === 'dark') ? t : (mq.matches ? 'dark' : 'light');
        }
        btn.addEventListener('click', function () {
          var next = current() === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = next;
          try { localStorage.setItem('theme', next); } catch (e) {}
          document.dispatchEvent(new CustomEvent('theme-change'));
        });
        window.addEventListener('keydown', function (e) {
          if (e.key !== 't' || e.metaKey || e.ctrlKey || e.altKey) return;
          var el = document.activeElement;
          if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
          btn.click();
        });
        mq.addEventListener('change', function () {
          if (!document.documentElement.dataset.theme) {
            document.dispatchEvent(new CustomEvent('theme-change'));
          }
        });
      })();
    </script>
  </body>
</html>
