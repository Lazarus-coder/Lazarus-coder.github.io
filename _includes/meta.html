<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="{{ site.name }}">
<meta name="generator" content="Jekyll">

{% if page.excerpt %}
  {% assign meta_desc = page.excerpt | strip_html | normalize_whitespace %}
{% elsif page.description %}
  {% assign meta_desc = page.description %}
{% else %}
  {% assign meta_desc = site.description %}
{% endif %}
<meta name="description" content="{{ meta_desc }}">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1113">

<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}">
<meta property="og:description" content="{{ meta_desc }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/images/og.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">

<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
